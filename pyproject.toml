[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "oc_lettings_site.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-v --cov=. --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=80"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "tests.py",
    "*/tests.py",
    "*/__init__.py",
    "manage.py",
    "*/wsgi.py",
    "*/asgi.py",
    "*/apps.py",
    "*/settings.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __str__",
    "def __repr__",
    "if settings.DEBUG",
    "raise NotImplementedError",
]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-django = "^4.14.0"
pytest-cov = "^7.1.0"
flake8 = "^3.7.0"

[project]
name = "python-oc-lettings-fr"
version = "0.1.0"
description = ""
authors = [
    {name = "SamuelGuillot",email = "samuel.guillot.pro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django (>=5.2.18,<6.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "sentry-sdk[django] (>=2.20.0,<3.0.0)",
    "whitenoise (>=6.7.0,<7.0.0)",
    "dj-database-url (>=2.3.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
